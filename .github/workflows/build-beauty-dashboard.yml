name: Build Beauty Review Dashboard Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download cleaned Parquet release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/lwadipeba/ProjectDSO576/releases/download/v1.0/beauty_cleaned.parquet" \
            --output beauty_cleaned.parquet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade duckdb pandas

      - name: Prepare dashboard data
        run: python dashboard-v2/prepare_data.py

      - name: Upload dashboard data artifact
        uses: actions/upload-artifact@v4
        with:
          name: beauty-dashboard-data
          path: dashboard-data/dashboard_data.json
          if-no-files-found: error
          retention-days: 30
