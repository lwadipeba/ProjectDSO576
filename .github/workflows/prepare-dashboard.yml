
name: Prepare Beauty Dashboard Data

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download dataset
        run: |
          curl -L \
            "https://github.com/lwadipeba/ProjectDSO576/releases/download/v1.0/beauty_cleaned.parquet" \
            -o beauty_cleaned.parquet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install duckdb pandas

      - name: Inspect dataset
        run: |
          python -c "import duckdb; c=duckdb.connect(); print(c.execute(\"DESCRIBE SELECT * FROM read_parquet('beauty_cleaned.parquet')\").df().to_string()); print('ROW COUNT:', c.execute(\"SELECT COUNT(*) FROM read_parquet('beauty_cleaned.parquet')\").fetchone()[0])"
